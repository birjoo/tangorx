<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Safe Trade</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#5d6675;--line:#e3e6eb;--accent:#2f5bea;
  --buy:#0f8a4f;--hold:#a86400;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a20;--text:#e8eaee;
  --muted:#9aa3b2;--line:#272c35;--accent:#7b9bff;--buy:#3fcf8e;--hold:#f0b44c;--chip:#20252e}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a20;--text:#e8eaee;--muted:#9aa3b2;--line:#272c35;
  --accent:#7b9bff;--buy:#3fcf8e;--hold:#f0b44c;--chip:#20252e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);margin:4px 0 20px;font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar label{color:var(--muted);font-size:14px}
input{width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.verdict{font-size:28px;font-weight:800;margin:2px 0 12px}
.verdict.BUY{color:var(--buy)} .verdict.HOLD{color:var(--hold)}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 12px}
td{padding:6px 0;border-bottom:1px solid var(--line)} td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{padding:4px 0;font-size:15px}
.checks li::before{content:attr(data-mark);display:inline-block;width:24px}
.why{color:var(--muted);font-size:14px;margin:12px 0 0}
a{color:var(--accent)}
#status{color:var(--muted);font-size:14px}
.small{color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>This week's trade</h1>
  <p class="sub">One rule, tested on 48 weeks of history: buy Bitcoin only when it's trending up and calm. Otherwise hold stablecoins.</p>
  <div class="bar">
    <label for="equity">Account size ($)</label>
    <input id="equity" type="number" min="100" step="100" value="10000">
    <button id="run">Refresh</button>
    <span id="status">Loading…</span>
  </div>
  <div id="card" class="card" hidden></div>
  <p class="small">Backtest: +10% total, worst week −5.8%, biggest drop −12% (holding BTC: −17%, biggest drop −37%).
  Prices from Hyperliquid. Not financial advice.</p>
</main>
<script>
"use strict";
const HL = "https://api.hyperliquid.xyz/info";
const RISK = 0.01, MAXPOS = 0.5;
const post = async b => { const r = await fetch(HL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });
  if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); };
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const std = a => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const usd = x => "$" + Math.round(x).toLocaleString();
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
let cache = null;

function signal(k, mark) {
  const c = k.map(x => +x.c), h = k.map(x => +x.h), l = k.map(x => +x.l), n = c.length;
  const r = c.slice(1).map((x, i) => Math.log(x / c[i]));
  const ma50 = mean(c.slice(-50)), sd = std(r.slice(-37, -7)), worst = Math.max(...r.slice(-7).map(Math.abs));
  const tr = c.map((_, i) => i ? Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])) : h[i] - l[i]);
  return { price: mark || c[n - 1], close: c[n - 1], ma50, up: c[n - 1] > ma50, shock: worst > 3 * sd, sigma: worst / sd, atr: mean(tr.slice(-14)) };
}

function render(s, eq) {
  const box = document.getElementById("card"); box.hidden = false; box.replaceChildren();
  const buy = s.up && !s.shock;
  box.append(el("div", "verdict " + (buy ? "BUY" : "HOLD"), buy ? "BUY BITCOIN" : "HOLD STABLECOINS"));
  if (buy) {
    const stop = s.price - 2 * s.atr, target = s.price + 3 * s.atr;
    const units = Math.min(eq * RISK / (s.price - stop), eq * MAXPOS / s.price);
    const t = el("table");
    [["Buy at", usd(s.price)], ["Stop (sell if it falls to)", usd(stop)], ["Target (sell if it rises to)", usd(target)],
     ["Amount", `${units.toFixed(5)} BTC (${usd(units * s.price)})`], ["Most you can lose", usd(units * (s.price - stop))],
     ["Sell after", "7 days if neither is hit"]].forEach(([a, b]) => { const r = el("tr"); r.append(el("td", null, a), el("td", null, b)); t.append(r); });
    box.append(t);
  } else {
    box.append(el("p", null, "Keep your money in USDC or USDT this week. If you want yield, lend it on a major platform (about 4–8% a year)."));
  }
  const ul = el("ul", "checks");
  [[s.up, `Bitcoin is ${s.up ? "above" : "below"} its 50-day average (${usd(s.close)} vs ${usd(s.ma50)})`],
   [!s.shock, s.shock ? `Calm market: no, a day moved ${s.sigma.toFixed(1)}× its normal range this week` : "Calm market: no shock in the last 7 days"]]
    .forEach(([ok, txt]) => { const li = el("li", null, txt); li.dataset.mark = ok ? "✅" : "❌"; ul.append(li); });
  box.append(ul);
  const a = el("a", null, "Bitcoin chart on TradingView ↗"); a.href = "https://www.tradingview.com/chart/?symbol=BINANCE:BTCUSDT"; a.target = "_blank"; a.rel = "noopener";
  const p = el("p", "why"); p.append(a); box.append(p);
}

async function run(refetch) {
  const btn = document.getElementById("run"), eq = Math.max(100, +document.getElementById("equity").value || 10000);
  try { localStorage.setItem("equity", eq); } catch {}
  btn.disabled = true;
  try {
    if (refetch || !cache) {
      document.getElementById("status").textContent = "Loading…";
      const end = Date.now();
      const [k, mids] = await Promise.all([
        post({ type: "candleSnapshot", req: { coin: "BTC", interval: "1d", startTime: end - 120 * 864e5, endTime: end } }),
        post({ type: "allMids" }).catch(() => ({}))]);
      if (!k || k.length < 60) throw new Error("not enough price history");
      cache = signal(k, +mids.BTC || 0);
    }
    render(cache, eq);
    document.getElementById("status").textContent = "Updated " + new Date().toLocaleString();
  } catch (e) {
    document.getElementById("status").textContent = "Couldn't load prices (" + e.message + "). Press Refresh.";
  } finally { btn.disabled = false; }
}
try { const v = localStorage.getItem("equity"); if (v) document.getElementById("equity").value = v; } catch {}
document.getElementById("run").addEventListener("click", () => run(true));
document.getElementById("equity").addEventListener("change", () => cache && run(false));
run(true);
</script>
</body>
</html>
